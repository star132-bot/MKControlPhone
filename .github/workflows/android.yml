name: Android CI and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Verify project and build debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon

      - name: Prepare versioned APK
        id: package
        shell: bash
        run: |
          version_name="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          test -n "$version_name"
          mkdir -p release-assets
          artifact_name="GestureDot-v${version_name}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/$artifact_name"
          sha256sum "release-assets/$artifact_name" > "release-assets/$artifact_name.sha256"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Require tag to match app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v${{ steps.package.outputs.version_name }}"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v6
        with:
          name: GestureDot-${{ github.sha }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified APK
        uses: actions/download-artifact@v7
        with:
          name: GestureDot-${{ github.sha }}
          path: release-assets

      - name: Publish prerelease and APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          apk_path="release-assets/GestureDot-${GITHUB_REF_NAME}-debug.apk"
          checksum_path="$apk_path.sha256"
          test -f "$apk_path"
          test -f "$checksum_path"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$apk_path" "$checksum_path" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$apk_path" "$checksum_path" \
              --repo "$GITHUB_REPOSITORY" \
              --title "GestureDot $GITHUB_REF_NAME" \
              --generate-notes \
              --prerelease
          fi
